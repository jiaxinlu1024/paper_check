      - hyperbolic discounting
      - hyperbolic discount function
      - declining discount rates
      - preference reversal over time
      - impulsiveness
      - matching law
      - delay discounting
      - Ainslie
    original:
      authors: ["Ainslie, George"]
      year: 1975
      title: "Specious reward: A behavioral theory of impulsiveness and impulse control."
      container: Psychological Bulletin
      volume: "82"
      issue: "4"
      pages: "463-496"
      doi: 10.1037/h0076860
    often_miscited_as:
      - source: Laibson (1997), Quarterly Journal of Economics 112(2)
        doi: 10.1162/003355397555253
        why: >-
          Applies a quasi-hyperbolic (beta-delta) function to consumption and saving; not the
          origin of hyperbolic discounting or of the evidence for it.
        code: S4
      - source: Loewenstein and Prelec (1992), Quarterly Journal of Economics 107(2)
        doi: 10.2307/2118482
        why: Right for the generalized hyperbola and the catalogue of intertemporal anomalies, not for the origin.
        code: S4
    rule: >-
      Cite Ainslie (and his 1975 review) for the origin of hyperbolic discounting and Thaler
      (1981), Economics Letters 8(3), doi 10.1016/0165-1765(81)90067-7, for the first human
      evidence. Laibson (1997) is the source for applying a quasi-hyperbolic function to
      consumption and saving; crediting it with discovering hyperbolic discounting is
      misattributed (S4).
    evidence:
      - quote: "He explained this in terms of hyperbolic discounting of future rewards, derived from ideas that Rachlin and others had developed from Richard Herrnstein's matching law."
        url: https://en.wikipedia.org/wiki/George_Ainslie_(psychologist)
        kind: encyclopedia
      - quote: "Thaler (1981) provided the first experimental evidence of hyperbolic discounting in humans."
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "This paper analyzes the decisions of a hyperbolic consumer who has access to an imperfect commitment technology"
        url: https://ideas.repec.org/a/oup/qjecon/v112y1997i2p443-478..html
        kind: original_abstract
    status: likely
    notes: >-
      Likely, not verified: the quotes credit Ainslie but do not tie the idea to the 1975
      article specifically (the encyclopedia lists it with his 1974 pigeon study, and the
      2017 Nobel background cites Ainslie 1992, Picoeconomics). The review that dates this
      history, Frederick, Loewenstein and O'Donoghue (2002, Journal of Economic Literature
      40(2), doi 10.1257/jel.40.2.351), was paywalled. The third quote is from Laibson's
      abstract.

