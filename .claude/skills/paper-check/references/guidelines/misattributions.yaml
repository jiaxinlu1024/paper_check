        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "Research on this second type of time-inconsistency was one of the motivations for the prize to the 2004 Laureates in Economic Sciences, Finn Kydland and Edward Prescott (Kydland and Prescott 1977)."
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "R. H. Strotz, 1955. \"Myopia and Inconsistency in Dynamic Utility Maximization,\" The Review of Economic Studies"
        url: https://ideas.repec.org/a/oup/restud/v23y1955i3p165-180..html
        kind: metadata_record
    status: verified
    notes: >-
