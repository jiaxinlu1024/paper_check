    finding: >-
      Iyengar and Lepper (2000) found that people were more likely to buy jams or chocolates,
      or to write an optional essay, when offered 6 options rather than 24 or 30; the
      meta-analysis of Scheibehenne, Greifeneder and Todd (2010) found a mean choice-overload
      effect of virtually zero.
