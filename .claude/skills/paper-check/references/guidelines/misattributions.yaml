  # -------------------------------------------------------- time preference and self-control

  - id: time-inconsistency-strotz
    topic: time preference and self-control
    finding: >-
      Strotz's "Myopia and Inconsistency in Dynamic Utility Maximization" showed that
      non-exponential discounting makes plans time-inconsistent and discussed commitment
      devices; the article is dated 1955 in Crossref and RePEc but is widely cited as 1956.
    terms:
      - time inconsistency
      - dynamic inconsistency
      - time-inconsistent preferences
      - myopia
      - consistent planning
      - precommitment
      - Strotz (1955)
      - Strotz (1956)
    original:
      authors: ["Strotz, R. H."]
      year: 1955
      title: Myopia and Inconsistency in Dynamic Utility Maximization
      container: The Review of Economic Studies
      volume: "23"
      issue: "3"
      pages: "165-180"
      doi: 10.2307/2295722
    often_miscited_as:
      - source: "\"Strotz (1956)\""
        why: >-
          The volume is dated 1955-56; Crossref and RePEc give 1955, the 2017 Nobel
          background uses 1956. Both identify the same article; only flag a reference list and
          text that disagree.
        code: CIT-03
      - source: Laibson (1997) or O'Donoghue and Rabin (1999) as the origin of time inconsistency
        why: Later applications of the idea.
        code: S4
      - source: Kydland and Prescott (1977)
        why: Time inconsistency of government policy, a different concept from individual discounting.
        code: S4
    rule: >-
      Cite Strotz for the origin of time-inconsistent preferences in economics; 1955 and 1956
      both occur for the same article. Crediting Laibson (1997) or O'Donoghue and Rabin
      (1999) with the idea is misattributed (S4), and Kydland and Prescott (1977) concern
      policy, not individual preferences.
    evidence:
