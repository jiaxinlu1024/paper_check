    rule: >-
      Cite Iyengar and Lepper (2000) for the jam and chocolate studies. A sentence that
      treats choice overload as a general, reliable effect should mention the meta-analysis
      of Scheibehenne, Greifeneder and Todd (2010), Journal of Consumer Research 37(3),
      doi 10.1086/651235 (CIT-14).
    evidence:
      - quote: "people are more likely to purchase gourmet jams or chocolates or to undertake optional class essay assignments when offered a limited array of 6 choices rather than a more extensive array of 24 or 30 choices."
