  - id: gift-exchange
    topic: social preferences and games
    finding: >-
      Akerlof (1982) modeled labor contracts as partial gift exchange, with firms paying above
      the market-clearing wage to raise effort norms; Fehr, Kirchsteiger and Riedl (1993)
      gave laboratory support, and Gneezy and List (2006) found field effects that fade
      within hours.
    terms:
      - gift exchange
      - gift-exchange game
      - fair wage-effort hypothesis
      - efficiency wages and fairness
      - reciprocity in labor markets
      - above-market wages and effort
      - partial gift exchange
    original:
      authors: ["Akerlof, George A."]
      year: 1982
      title: Labor Contracts as Partial Gift Exchange
      container: The Quarterly Journal of Economics
      volume: "97"
      issue: "4"
      pages: "543-569"
      doi: 10.2307/1885099
    often_miscited_as:
      - source: Fehr, Kirchsteiger and Riedl (1993), Quarterly Journal of Economics 108(2)
        doi: 10.2307/2118338
        why: The experimental test, not the gift-exchange idea.
        code: S4
      - source: Gneezy and List (2006), Econometrica 74(5), cited as showing lasting gift exchange in the field
        doi: 10.1111/j.1468-0262.2006.00707.x
        why: Effort was higher only in the first hours, and the gift lowered output per dollar overall.
        code: S2
    rule: >-
      Cite Akerlof (1982) for the theory and Fehr, Kirchsteiger and Riedl (1993) for the
      laboratory evidence. A sentence implying that above-market wages produce lasting effort
      gains in the field should note Gneezy and List (2006) (CIT-14).
    evidence:
      - quote: "Workers' effort depends upon the norms determining a fair day's work. In order to affect those norms, firms may pay more than the market-clearing wage."
        url: https://ideas.repec.org/a/oup/qjecon/v97y1982i4p543-569..html
        kind: original_abstract
      - quote: "These results provide, therefore, experimental support for the fair wage-effort theory of involuntary unemployment."
        url: https://ideas.repec.org/a/oup/qjecon/v108y1993i2p437-459..html
        kind: later_paper
    replication:
      note: >-
        Gneezy and List (2006): effort was higher in the "gift" treatment in the first few
        hours, after which no difference was observed.
      url: https://ideas.repec.org/a/ecm/emetrp/v74y2006i5p1365-1384.html
    status: verified
    notes: >-
      Crossref lists only the first page (543); the range is from RePEc/IDEAS.

