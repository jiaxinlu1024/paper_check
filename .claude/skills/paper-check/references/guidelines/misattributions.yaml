    finding: >-
      Hyperbolic discounting, discount rates that fall with delay so that preferences
      reverse as both rewards recede, comes from Ainslie's work on impulsiveness, building
      on Herrnstein's matching law; Thaler (1981) gave the first experimental evidence in
      humans.
