  - id: marshmallow-test
    topic: time preference and self-control
    finding: >-
      The link between preschool delay of gratification and adolescent outcomes such as SAT
      scores comes from the follow-up by Shoda, Mischel and Peake (1990); Watts, Duncan and
      Quan (2018) found the association about half as large and much reduced by background
      controls.
    terms:
      - marshmallow test
      - marshmallow experiment
      - Stanford marshmallow experiment
      - delay of gratification
      - preschool delay
      - SAT scores and delay
      - self-control in children
    original:
      authors: ["Shoda, Yuichi", "Mischel, Walter", "Peake, Philip K."]
      year: 1990
      title: "Predicting adolescent cognitive and self-regulatory competencies from preschool delay of gratification: Identifying diagnostic conditions."
      container: Developmental Psychology
      volume: "26"
      issue: "6"
      pages: "978-986"
      doi: 10.1037/0012-1649.26.6.978
    often_miscited_as:
      - source: Mischel and Ebbesen (1970), Journal of Personality and Social Psychology 16(2)
        doi: 10.1037/h0029815
        why: The original delay experiments, with no long-run outcomes.
        code: S4
      - source: Mischel, Shoda and Rodriguez (1989), Science 244(4907)
        doi: 10.1126/science.2658056
        why: An overview of the research program; fine for an overview, secondhand for the SAT result.
        code: S5
      - source: Shoda, Mischel and Peake (1990) cited as showing a strong, causal effect of self-control
        why: The conceptual replication found a much smaller association that shrinks with controls.
        code: CIT-14
    rule: >-
      For the link between preschool delay and adolescent outcomes, cite Shoda, Mischel and
      Peake (1990). Citing Mischel and Ebbesen (1970) for long-run outcomes is misattributed
      (S4). A sentence presenting the link as strong or causal should note Watts, Duncan and
      Quan (2018) (CIT-14).
    evidence:
      - quote: "We replicated and extended Shoda, Mischel, and Peake's (1990) famous marshmallow study, which showed strong bivariate correlations between a child's ability to delay gratification just before entering school and both adolescent achievement and socioemotional behaviors."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=29799765&rettype=abstract&retmode=text
        kind: later_paper
      - quote: "In 1990, a second follow-up study showed that the ability to delay gratification also correlated with higher SAT scores."
        url: https://en.wikipedia.org/wiki/Stanford_marshmallow_experiment
        kind: encyclopedia
    replication:
      note: >-
        Watts, Duncan and Quan (2018, Psychological Science 29(7), doi
        10.1177/0956797618761661): the bivariate correlation was about half the original size
        and fell by two thirds with controls for family background, early cognitive ability
        and the home environment.
      url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=29799765&rettype=abstract&retmode=text
    status: verified

