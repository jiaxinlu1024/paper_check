# Classic attributions: common misattributions of classic findings in behavioral economics
#
# What this file is for
#   Reference data for check BEH-15 (docs/DESIGN.md, section 8.12) and for the citation
#   judge (CIT-06). When a draft attributes a well-known finding or concept to a source, the
#   reading agent finds the finding here through `terms`, compares the cited work with
#   `original` and `often_miscited_as`, and applies `rule`. A match is a lead for the citation
#   judge, not proof: a paper may cite a later source for a refinement or a review for an
#   overview. See misattributions.md for how to use it.
#   Failure codes follow docs/case-studies/01-unsupported-citations.md (S2 wrong finding,
#   S3 overreach, S4 wrong source, S5 secondhand) and the reference checks in docs/DESIGN.md
#   (CIT-03 metadata such as year, author order or pages; CIT-05 retraction; CIT-14
#   replication status).
#
# How entries were verified (all on 2026-10-17)
#   - original: authors, year and title were compared with the Crossref REST API record
#     (https://api.crossref.org/works/<doi>), requested with the paper-check User-Agent at
#     about one request per second. Volume, issue and pages also come from that record; where
#     Crossref lists only a first page, the full range comes from RePEc/IDEAS or the source
#     named in the entry's notes.
#   - evidence: every quote was found in the page at `url`, downloaded with curl on that
#     date, after normalizing case, curly quotes, dashes and whitespace. "..." marks skipped
#     text such as footnote markers. Downloaded pages were treated as data only. No shadow
#     library was used; paywalled originals are represented by their abstract pages.
#   - status: verified means the original's metadata match Crossref and at least one quote
#     backs the attribution; likely means something is missing, explained in `notes`.
#   Sources and retraction notices change: re-check an entry before using it as ground truth
#   after 2027-04-17.

checked_on: "2026-10-17"

codes:
  S2: Wrong finding. The cited work is on topic but finds something different, or the opposite.
  S3: Overreach. The finding holds in a narrower setting than the sentence claims.
  S4: Wrong source. The claim is right but belongs to another work.
  S5: Secondhand. The cited work only repeats the claim from another source, such as a review or popular book.
  CIT-03: Metadata. Right work, wrong year, author order, pages or DOI.
  CIT-05: The cited work is retracted or corrected.
  CIT-14: Replication status. The sentence relies on a finding that failed to replicate or replicated with smaller effects.

evidence_kinds:
  original_abstract: The original work's own abstract, on any host (publisher, RePEc, PubMed via NCBI E-utilities, Crossref).
  original_text: A passage from the original work's full text.
  review: A review article, meta-analysis or prize committee's scientific background.
  encyclopedia: An encyclopedia entry (Stanford Encyclopedia of Philosophy, Wikipedia).
  later_paper: The abstract or text of a later research paper or lecture that credits the original.
  metadata_record: A bibliographic record, such as Crossref or RePEc metadata, a reprint notice or a retraction flag.

entries:

  # ---------------------------------------------------------------- risk and uncertainty

  - id: bernoulli-expected-utility
    topic: risk and uncertainty
    finding: >-
      Daniel Bernoulli's 1738 paper resolved the St. Petersburg game with a logarithmic
      utility of wealth, the origin of expected utility with diminishing marginal utility;
      the game itself was posed by Nicolaus Bernoulli in 1713.
    terms:
      - St. Petersburg paradox
      - St Petersburg paradox
      - St. Petersburg game
      - Bernoulli utility
      - logarithmic utility
      - log utility of wealth
      - diminishing marginal utility of wealth
      - moral expectation
      - Bernoulli (1738)
      - Bernoulli (1954)
    original:
      authors: ["Bernoulli, Daniel"]
      year: 1954
      title: Exposition of a New Theory on the Measurement of Risk
      container: Econometrica
      volume: "22"
      issue: "1"
      pages: "23-36"
      doi: 10.2307/1909829
      note: >-
        English translation (by Louise Sommer) of "Specimen theoriae novae de mensura
        sortis", Commentarii Academiae Scientiarum Imperialis Petropolitanae 5 (1738):
        175-192. The 1954 translation is the version with a DOI.
    often_miscited_as:
      - source: Bernoulli (1954) presented as a 1954 contribution
        why: The 1954 Econometrica article is a translation of the 1738 paper; dating the idea to 1954 is a year error.
        code: CIT-03
      - source: Daniel Bernoulli credited with posing the St. Petersburg problem
        why: Nicolaus Bernoulli posed it in a 1713 letter to Montmort; Daniel Bernoulli's 1738 paper analysed it.
        code: S4
    rule: >-
      Cite the idea as Bernoulli (1738), giving the 1954 Econometrica translation as the
      accessible version, for example "Bernoulli (1738/1954)". A sentence that dates
      expected-utility reasoning to 1954 has a year error (CIT-03). A sentence crediting
      Daniel Bernoulli with posing the problem is misattributed (S4). Citing the translation
      itself, with the 1738 date, is correct.
    evidence:
      - quote: "The St. Petersburg paradox was introduced by Nicolaus Bernoulli in 1713."
        url: https://plato.stanford.edu/entries/paradox-stpetersburg/
        kind: encyclopedia
      - quote: "Daniel argued that the agent’s utility of wealth equals the logarithm of the monetary amount"
        url: https://plato.stanford.edu/entries/paradox-stpetersburg/
        kind: encyclopedia
      - quote: "English translation, 1954, “Exposition of a New Theory on the Measurement of Risk”, Econometrica, 22(1): 23–36."
        url: https://plato.stanford.edu/entries/paradox-stpetersburg/
        kind: encyclopedia
    status: verified
    notes: >-
      Crossref lists only the first page (23); the range 23-36 is from the Stanford
      Encyclopedia of Philosophy bibliography. Wikipedia's St. Petersburg paradox article
      gives 22-36, which conflicts with Crossref's first page.

  - id: allais-paradox
    topic: risk and uncertainty
    finding: >-
      Allais (1953) designed paired choice problems in which common preferences violate the
      independence axiom of expected utility, the Allais paradox (common-consequence effect).
    terms:
      - Allais paradox
      - Allais problem
      - common consequence effect
      - violation of the independence axiom
      - certainty effect
    original:
      authors: ["Allais, Maurice"]
      year: 1953
      title: "Le Comportement de l'Homme Rationnel devant le Risque: Critique des Postulats et Axiomes de l'Ecole Americaine"
      container: Econometrica
      volume: "21"
      issue: "4"
      pages: "503-546"
      doi: 10.2307/1907921
    often_miscited_as:
      - source: Kahneman and Tversky (1979), Econometrica 47(2)
        doi: 10.2307/1914185
        why: >-
          They report Allais-type problems and name the "certainty effect", but the paradox
          is Allais's. Citing them for the certainty effect is correct; citing them as the
          origin of the paradox is not.
        code: S4
      - source: Later English-language reprints or textbook accounts dated after 1953
        why: The paradox was published in Econometrica in 1953; a later date is a year error or a secondhand source.
        code: S5
    rule: >-
      A sentence attributing the Allais paradox, or the common-consequence violation of
      independence, to Kahneman and Tversky (1979) is misattributed (S4); cite Allais (1953).
      Kahneman and Tversky (1979) are the right source for the label "certainty effect".
    evidence:
      - quote: "Departures from the von Neumann-Morgenstern-Savage expected-utility theories of decisions under uncertainty were first pointed out by the 1988 economics laureate Maurice Allais (1953a), who established the so-called Allais paradox"
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2002.pdf
        kind: review
      - quote: "The Allais paradox is a choice problem designed by Maurice Allais in 1953 to show an inconsistency of actual observed choices with the predictions of expected utility theory."
        url: https://en.wikipedia.org/wiki/Allais_paradox
        kind: encyclopedia
      - quote: "This tendency, called the certainty effect, contributes to risk aversion in choices involving sure gains and to risk seeking in choices involving sure losses."
        url: https://ideas.repec.org/a/ecm/emetrp/v47y1979i2p263-91.html
        kind: original_abstract
    status: verified
    notes: >-
      Crossref lists only the first page (503); the range 503-546 is from the reference
      lists of the 2002 and 2017 Nobel scientific backgrounds. The 2002 background labels
      this paper 1953a. The third quote is the abstract of Kahneman and Tversky (1979), not
      of Allais.

  - id: ellsberg-paradox
    topic: risk and uncertainty
    finding: >-
      Ellsberg (1961) showed with urn bets that many people prefer known to unknown
      probabilities in a way that violates Savage's axioms, the standard origin of ambiguity
      aversion; Keynes (1921) had published a version of the problem.
    terms:
      - Ellsberg paradox
      - ambiguity aversion
      - ambiguity
      - uncertainty aversion
      - Knightian uncertainty
      - urn with unknown composition
      - two-color urn
      - three-color urn
    original:
      authors: ["Ellsberg, Daniel"]
      year: 1961
      title: Risk, Ambiguity, and the Savage Axioms
      container: The Quarterly Journal of Economics
      volume: "75"
      issue: "4"
      pages: "643-669"
      doi: 10.2307/1884324
    often_miscited_as:
      - source: Knight (1921), Risk, Uncertainty and Profit
        why: >-
          Knight's distinction between measurable risk and unmeasurable uncertainty is the
          conceptual background; the urn choices and the label "ambiguity" come from Ellsberg.
        code: S4
      - source: Models of ambiguity aversion (for example maxmin expected utility) cited as the evidence
        why: Later models explain the Ellsberg choices; they are not the original evidence.
        code: S4
    rule: >-
      Cite Ellsberg (1961) for the urn evidence of ambiguity aversion. Citing Knight (1921)
      for the risk-uncertainty distinction, or Keynes (1921) for an early version of the
      problem, is fine; citing Knight for the choice pattern is misattributed (S4).
    evidence:
      - quote: "John Maynard Keynes published a version of the paradox in 1921. ... Daniel Ellsberg popularized the paradox in his 1961 paper, \"Risk, Ambiguity, and the Savage Axioms\"."
        url: https://en.wikipedia.org/wiki/Ellsberg_paradox
        kind: encyclopedia
      - quote: "who established the so-called Allais paradox (see also Ellsberg, 1961, for a related paradox)"
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2002.pdf
        kind: review
    status: verified
    notes: >-
      Crossref lists only the first page (643); the range is from RePEc/IDEAS
      (https://ideas.repec.org/a/oup/qjecon/v75y1961i4p643-669..html).

  - id: prospect-theory
    topic: risk and uncertainty
    finding: >-
      Kahneman and Tversky (1979) introduced prospect theory: value defined over gains and
      losses rather than final wealth, a value function steeper for losses than for gains,
      decision weights in place of probabilities, and the certainty and isolation effects.
    terms:
      - prospect theory
      - original prospect theory
      - value function
      - reference point
      - reference dependence
      - decision weights
      - certainty effect
      - isolation effect
      - reflection effect
      - losses loom larger than gains
      - Kahneman and Tversky (1979)
    original:
      authors: ["Kahneman, Daniel", "Tversky, Amos"]
      year: 1979
      title: "Prospect Theory: An Analysis of Decision under Risk"
      container: Econometrica
      volume: "47"
      issue: "2"
      pages: "263-291"
      doi: 10.2307/1914185
    often_miscited_as:
      - source: Tversky and Kahneman (1992), Journal of Risk and Uncertainty 5(4)
        doi: 10.1007/BF00122574
        why: >-
          Cumulative prospect theory, a later version with cumulative decision weights; right
          for that version and its parameter estimates, wrong as the introduction of prospect
          theory.
        code: S4
      - source: "\"Tversky and Kahneman (1979)\" or \"Kahneman and Tversky (1992)\""
        why: Author order swapped; the 1979 paper is Kahneman and Tversky, the 1992 paper Tversky and Kahneman.
        code: CIT-03
      - source: Kahneman (2011), Thinking, Fast and Slow
        why: Popular book; secondhand for the theory.
        code: S5
    rule: >-
      Cite Kahneman and Tversky (1979) for the original theory and its qualitative claims.
      Cite Tversky and Kahneman (1992) for cumulative prospect theory, the fourfold pattern
      and parameter estimates. Swapped author order is a metadata error (CIT-03).
    evidence:
      - quote: "An alternative theory of choice is developed, in which value is assigned to gains and losses rather than to final assets and in which probabilities are replaced by decision weights."
        url: https://ideas.repec.org/a/ecm/emetrp/v47y1979i2p263-91.html
        kind: original_abstract
      - quote: "This version, called cumulative prospect theory, applies to uncertain as well as to risky prospects with any number of outcomes"
        url: https://ideas.repec.org/a/kap/jrisku/v5y1992i4p297-323.html
        kind: original_abstract
      - quote: "These anomalies are a manifestation of an asymmetry of value that Kahneman and Tversky (1984) call loss aversion"
        url: https://www.aeaweb.org/articles?id=10.1257/jep.5.1.193
        kind: review
    status: verified
    notes: >-
      Crossref lists only the first page (263); the range is from RePEc/IDEAS. On the label:
      Kahneman, Knetsch and Thaler (1991) credit the term "loss aversion" to Kahneman and
      Tversky (1984), "Choices, values, and frames", American Psychologist 39(4): 341-350,
      doi 10.1037/0003-066X.39.4.341. Whether the 1979 paper itself uses the phrase was not
      checked, because its full text is paywalled, so do not flag a sentence on that point
      alone.

  - id: loss-aversion-coefficient
    topic: risk and uncertainty
    finding: >-
      The loss-aversion coefficient of about 2.25 (with value-function curvature 0.88) is
      the median estimate from the experiment in Tversky and Kahneman (1992); the 1979
      prospect theory paper describes the value function only qualitatively.
    terms:
      - loss aversion coefficient
      - coefficient of loss aversion
      - loss-aversion parameter
      - lambda = 2.25
      - "λ = 2.25"
      - "λ ≈ 2"
      - losses weigh about twice as much as gains
      - losses hurt twice as much
      - cumulative prospect theory parameters
      - "0.88"
    original:
      authors: ["Tversky, Amos", "Kahneman, Daniel"]
      year: 1992
      title: "Advances in prospect theory: Cumulative representation of uncertainty"
      container: Journal of Risk and Uncertainty
      volume: "5"
      issue: "4"
      pages: "297-323"
      doi: 10.1007/BF00122574
    often_miscited_as:
      - source: Kahneman and Tversky (1979), Econometrica 47(2)
        doi: 10.2307/1914185
        why: >-
          The 1979 abstract states only that the value function is steeper for losses than
          for gains; the numerical estimate comes from the 1992 experiment.
        code: S4
      - source: Tversky and Kahneman (1991), Quarterly Journal of Economics 106(4)
        doi: 10.2307/2937956
        why: >-
          The riskless-choice paper; the 2.25 median comes from the 1992 risky-choice
          experiment. Published papers make this slip, for example Gächter, Johnson and
          Herrmann (2022, Theory and Decision), who write of "the popular estimate of 2.25
          of Tversky and Kahneman (1991)".
        code: S4
      - source: Kahneman (2011) or textbooks
        why: Secondhand for a number.
        code: S5
    rule: >-
      A sentence attributing a numerical loss-aversion estimate of about 2 to 2.25 to
      Kahneman and Tversky (1979) is misattributed (S4); cite Tversky and Kahneman (1992).
      If the sentence presents 2.25 as the typical or consensus value, flag that too (S3):
      it is a median from 25 graduate students in unincentivized choices, and the
      meta-analysis of Brown, Imai, Vieider and Camerer (2024) puts the mean at 1.955.
    evidence:
      - quote: "The earliest evidence recorded in our dataset is Tversky and Kahneman’s (1992) famous 2.25."
        url: https://biblio.ugent.be/publication/8756103/file/8756105.pdf
        kind: review
      - quote: "including the iconic measure of 2.25 reported by Tversky and Kahneman (1992)"
        url: https://biblio.ugent.be/publication/8756103/file/8756105.pdf
        kind: review
      - quote: "Tversky and Kahneman (1992) estimated that the value attached to a moderate loss is about twice the value attached to an equally large gain."
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2002.pdf
        kind: review
      - quote: "The value function is normally concave for gains, commonly convex for losses, and is generally steeper for losses than for gains."
        url: https://ideas.repec.org/a/ecm/emetrp/v47y1979i2p263-91.html
        kind: original_abstract
    replication:
      note: >-
        Meta-analysis of 607 estimates from 150 articles: mean loss-aversion coefficient
        1.955, 95 percent interval [1.820, 2.102] (Brown, Imai, Vieider and Camerer 2024,
        Journal of Economic Literature 62(2), doi 10.1257/jel.20221698).
      url: https://www.aeaweb.org/articles?id=10.1257/jel.20221698
    status: verified
    notes: >-
      This is the S4 example in case study 1. The 1992 attribution is confirmed by Brown et
      al. (2024), green open-access copy at Ghent University, which also describes the
      sample (25 graduate students, three unincentivized sessions) and reports median
      curvature 0.88. That the 1979 paper gives no numerical estimate rests on its abstract
      and on Brown et al. treating the 1992 figure as one of the first estimates; the 1979
      full text is paywalled and was not read page by page. The Gächter et al. quote is at
      https://link.springer.com/article/10.1007/s11238-021-09839-8.

  # ------------------------------------------------- reference dependence and mental accounting

  - id: endowment-effect-term
    topic: reference dependence and mental accounting
    finding: >-
      Thaler (1980) coined the term "endowment effect" for valuing a good more once one owns
      it, and related it to loss aversion in prospect theory.
    terms:
      - endowment effect
      - WTA-WTP gap
      - willingness to accept exceeds willingness to pay
      - ownership effect
      - valuing what we own
      - opportunity costs underweighted
    original:
      authors: ["Thaler, Richard"]
      year: 1980
      title: Toward a positive theory of consumer choice
      container: Journal of Economic Behavior & Organization
      volume: "1"
      issue: "1"
      pages: "39-60"
      doi: 10.1016/0167-2681(80)90051-7
    often_miscited_as:
      - source: Kahneman, Knetsch and Thaler (1990), Journal of Political Economy 98(6)
        doi: 10.1086/261737
        why: The coffee-mug market experiments; right for the experiments, wrong for coining the term.
        code: S4
      - source: Kahneman, Knetsch and Thaler (1991), Journal of Economic Perspectives 5(1)
        doi: 10.1257/jep.5.1.193
        why: An "Anomalies" column reviewing the evidence; secondhand for the origin.
        code: S5
      - source: Kahneman and Tversky (1979)
        doi: 10.2307/1914185
        why: Prospect theory supplies the explanation (loss aversion), not the term.
        code: S4
    rule: >-
      Cite Thaler (1980) for the term and the original argument, Kahneman, Knetsch and Thaler
      (1990) for the mug experiments, and treat the 1991 column as a review (S5 if cited as
      the origin).
    evidence:
      - quote: "In Thaler (1980), he coined the term endowment effect for the tendency of individuals to value items more just because they own them"
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "Thaler (1980) called this pattern—the fact that people often demand much more to give up an object than they would be willing to pay to acquire it—the endowment effect."
        url: https://www.aeaweb.org/articles?id=10.1257/jep.5.1.193
        kind: review
      - quote: "The term endowment effect however was first explicitly coined in 1980 by the economist Richard Thaler"
        url: https://en.wikipedia.org/wiki/Endowment_effect
        kind: encyclopedia
    status: verified

  - id: endowment-effect-mugs
    topic: reference dependence and mental accounting
    finding: >-
      Kahneman, Knetsch and Thaler (1990) showed in repeated markets with coffee mugs and pens
      that the endowment effect persists with real stakes and learning (median WTA about
      twice median WTP), while induced-value tokens trade as predicted.
    terms:
      - mug experiment
      - coffee mugs
      - mugs and pens
      - undertrading
      - Coase theorem experiment
      - induced-value tokens
      - endowment effect experiment
      - WTA/WTP ratio of about 2
    original:
      authors: ["Kahneman, Daniel", "Knetsch, Jack L.", "Thaler, Richard H."]
      year: 1990
      title: Experimental Tests of the Endowment Effect and the Coase Theorem
      container: Journal of Political Economy
      volume: "98"
      issue: "6"
      pages: "1325-1348"
      doi: 10.1086/261737
    often_miscited_as:
      - source: Thaler (1980), Journal of Economic Behavior & Organization 1(1)
        doi: 10.1016/0167-2681(80)90051-7
        why: Named the effect with hypothetical examples; the mug market experiments are from 1990.
        code: S4
      - source: Kahneman, Knetsch and Thaler (1991), Journal of Economic Perspectives 5(1)
        doi: 10.1257/jep.5.1.193
        why: Review column; secondhand for the experiments.
        code: S5
      - source: Plott and Zeiler (2005), American Economic Review 95(3), cited as confirming the mug gap
        doi: 10.1257/0002828054201387
        why: With their training procedures they found no significant WTA-WTP gap for mugs.
        code: S2
    rule: >-
      Cite Kahneman, Knetsch and Thaler (1990) for the mug and pen markets. When a sentence
      presents the mug result as settled, check whether it mentions Plott and Zeiler (2005)
      and the reply by Isoni, Loomes and Sugden (2011) (CIT-14).
    evidence:
      - quote: "This paper reports several experiments that demonstrate that this \"endowment effect\" persists even in market settings with opportunities to learn. Consumption objects (e.g., coffee mugs) are randomly given to half the subjects in an experiment."
        url: https://ideas.repec.org/a/ucp/jpolec/v98y1990i6p1325-48.html
        kind: original_abstract
      - quote: "For coffee mugs and pens, the median reservation selling price (the WTA) was about twice as high as the median buying price (the WTP)."
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
    replication:
      note: >-
        Plott and Zeiler (2005) found no significant WTA-WTP gap for mugs after extensive
        training; Isoni, Loomes and Sugden (2011) found that the same protocol still produced
        a gap for lotteries (as summarized in the 2017 Nobel scientific background).
      url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
    status: verified

  - id: status-quo-bias
    topic: reference dependence and mental accounting
    finding: >-
      Samuelson and Zeckhauser (1988) named and documented status quo bias, in decision
      experiments and in faculty choices of health plans and retirement programs.
    terms:
      - status quo bias
      - status-quo bias
      - preference for the status quo
      - sticking with the current option
      - inertia in choice
    original:
      authors: ["Samuelson, William", "Zeckhauser, Richard"]
      year: 1988
      title: Status quo bias in decision making
      container: Journal of Risk and Uncertainty
      volume: "1"
      issue: "1"
      pages: "7-59"
      doi: 10.1007/BF00055564
    often_miscited_as:
      - source: Kahneman, Knetsch and Thaler (1991), Journal of Economic Perspectives 5(1)
        doi: 10.1257/jep.5.1.193
        why: Review column that uses Samuelson and Zeckhauser's term; secondhand for the origin.
        code: S5
      - source: Madrian and Shea (2001), Quarterly Journal of Economics 116(4)
        doi: 10.1162/003355301753265543
        why: Evidence on 401(k) defaults; related, but not the origin of the concept.
        code: S4
      - source: Thaler and Sunstein (2008), Nudge
        why: Popular book; secondhand.
        code: S5
    rule: >-
      Cite Samuelson and Zeckhauser (1988) for the term and the original evidence. Reviews
      and books that discuss status quo bias are secondhand for its origin (S5).
    evidence:
      - quote: "A series of decision-making experiments shows that individuals disproportionately stick with the status quo."
        url: https://ideas.repec.org/a/kap/jrisku/v1y1988i1p7-59.html
        kind: original_abstract
      - quote: "This so-called status-quo bias was first documented by Samuelson and Zeckhauser (1988; see also Kahneman, Knetsch, and Thaler 1991)."
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "The example also illustrates what Samuelson and Zeckhauser (1988) call a status quo bias"
        url: https://www.aeaweb.org/articles?id=10.1257/jep.5.1.193
        kind: review
    status: verified

  - id: mental-accounting
    topic: reference dependence and mental accounting
    finding: >-
      Thaler (1985) set out mental accounting as a model of consumer choice, introducing
      transaction utility; Thaler (1999) is a later statement of the theory, and Marketing
      Science reprinted the 1985 article in 2008.
    terms:
      - mental accounting
      - mental accounts
      - psychological accounting
      - transaction utility
      - acquisition utility
      - hedonic editing
      - non-fungibility of money
      - Mental accounting matters
    original:
      authors: ["Thaler, Richard"]
      year: 1985
      title: Mental Accounting and Consumer Choice
      container: Marketing Science
      volume: "4"
      issue: "3"
      pages: "199-214"
      doi: 10.1287/mksc.4.3.199
    often_miscited_as:
      - source: Thaler (2008), Marketing Science 27(1), 15-25
        doi: 10.1287/mksc.1070.0330
        why: >-
          The 2008 reprint of the 1985 article. A reference dated 1985 but carrying the 2008
          volume, pages or DOI mixes the two (Wikipedia's mental accounting article does
          this).
        code: CIT-03
      - source: Thaler (1999), Journal of Behavioral Decision Making 12(3)
        doi: "10.1002/(SICI)1099-0771(199909)12:3<183::AID-BDM318>3.0.CO;2-F"
        why: A later statement of the theory; fine for an overview, not as its introduction.
        code: S5
    rule: >-
      For the introduction of mental accounting or transaction utility, cite Thaler (1985),
      Marketing Science 4(3): 199-214. Volume 27(1), pages 15-25 or DOI
      10.1287/mksc.1070.0330 point to the 2008 reprint; if dated 1985, the metadata are mixed
      (CIT-03). Thaler (1999) is fine for an overview but not as the origin (S5).
    evidence:
      - quote: "Then the evaluation of purchases is modeled using the new concept of “transaction utility.”"
        url: https://ideas.repec.org/a/inm/ormksc/v4y1985i3p199-214.html
        kind: original_abstract
      - quote: "This article was originally published in Marketing Science, Volume 4, Issue 3"
        url: https://api.crossref.org/works/10.1287/mksc.1070.0330
        kind: metadata_record
      - quote: "In subsequent work, he developed the theory of mental accounting (Thaler 1985, 1999)"
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
    status: verified

  # ------------------------------------------------------------------ judgment and heuristics

  - id: anchoring-heuristic
    topic: judgment and heuristics
    finding: >-
      Tversky and Kahneman (1974) described anchoring and adjustment as one of three judgment
      heuristics, illustrated by estimates of the share of African countries in the United
      Nations after a spin of a rigged wheel of fortune.
    terms:
      - anchoring
      - anchoring and adjustment
      - anchoring effect
      - anchoring bias
      - arbitrary anchor
      - wheel of fortune
      - African countries in the United Nations
      - social security number anchor
      - coherent arbitrariness
    original:
      authors: ["Tversky, Amos", "Kahneman, Daniel"]
      year: 1974
      title: "Judgment under Uncertainty: Heuristics and Biases"
      container: Science
      volume: "185"
      issue: "4157"
      pages: "1124-1131"
      doi: 10.1126/science.185.4157.1124
    often_miscited_as:
      - source: Kahneman (2011), Thinking, Fast and Slow
        why: Popular book; secondhand.
        code: S5
      - source: Ariely, Loewenstein and Prelec (2003), Quarterly Journal of Economics 118(1)
        doi: 10.1162/00335530360535153
        why: >-
          The source for anchors drawn from social security numbers in valuations
          ("coherent arbitrariness"), not for the anchoring heuristic itself.
        code: S4
    rule: >-
      Cite Tversky and Kahneman (1974) for anchoring and adjustment as a judgment heuristic.
      Ariely, Loewenstein and Prelec (2003) are the right source for social-security-number
      anchors in valuation; Maniadis, Tufano and List (2014) for evidence that such
      valuation anchoring is weaker on replication.
    evidence:
      - quote: "(iii) adjustment from an anchor, which is usually employed in numerical prediction when a relevant value is available."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=17835457&rettype=abstract&retmode=text
        kind: original_abstract
      - quote: "In another study by Tversky and Kahneman, participants were asked to estimate the percentage of African countries in the United Nations."
        url: https://en.wikipedia.org/wiki/Anchoring_effect
        kind: encyclopedia
      - quote: "initial valuations of familiar products and simple hedonic experiences are strongly influenced by arbitrary \"anchors\" (sometimes derived from a person's social security number)"
        url: https://ideas.repec.org/a/oup/qjecon/v118y2003i1p73-106..html
        kind: original_abstract
    replication:
      note: >-
        Maniadis, Tufano and List (2014, American Economic Review 104(1), doi
        10.1257/aer.104.1.277) report new evidence on the strength of valuation anchoring
        and argue for caution about initial findings. Simple numeric-estimation anchoring
        items (Jacowitz and Kahneman 1995) were among the effects that replicated in Many
        Labs 1 (Klein et al. 2014).
      url: https://www.aeaweb.org/articles?id=10.1257/aer.104.1.277
    status: verified
    notes: >-
      The encyclopedia passage cites Tversky and Kahneman (1974) for the wheel-of-fortune
      study. The Many Labs list of effects is in the article's preprint
      (doi 10.31234/osf.io/ux8ef), which was read but is a Word file, so no quote is recorded.

  - id: framing-effect
    topic: judgment and heuristics
    finding: >-
      Tversky and Kahneman (1981) showed that equivalent descriptions of the same choice,
      framed as gains or as losses (the "Asian disease" problem about lives saved or lost),
      produce predictable reversals of preference.
    terms:
      - framing effect
      - framing
      - Asian disease problem
      - gain frame
      - loss frame
      - risky choice framing
      - lives saved versus lives lost
      - gain-loss framing
    original:
      authors: ["Tversky, Amos", "Kahneman, Daniel"]
      year: 1981
      title: The Framing of Decisions and the Psychology of Choice
      container: Science
      volume: "211"
      issue: "4481"
      pages: "453-458"
      doi: 10.1126/science.7455683
    often_miscited_as:
      - source: Kahneman and Tversky (1979), Econometrica 47(2)
        doi: 10.2307/1914185
        why: >-
          Prospect theory explains framing effects and names the related isolation effect,
          but the Asian disease problem and the framing label are from 1981.
        code: S4
      - source: Kahneman and Tversky (1984), American Psychologist 39(4)
        doi: 10.1037/0003-066X.39.4.341
        why: A later overview; fine for an overview, secondhand as the origin.
        code: S5
    rule: >-
      Cite Tversky and Kahneman (1981) for the framing effect and the Asian disease problem.
      Kahneman and Tversky (1979) introduced the isolation effect and the theory used to
      explain framing; attributing the Asian disease problem to 1979 is misattributed (S4).
    evidence:
      - quote: "The psychological principles that govern the perception of decision problems and the evaluation of probabilities and outcomes produce predictable shifts of preference when the same problem is framed in different ways."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=7455683&rettype=abstract&retmode=text
        kind: original_abstract
      - quote: "Reversals of preference are demonstrated in choices regarding monetary outcomes, both hypothetical and real, and in questions pertaining to the loss of human lives."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=7455683&rettype=abstract&retmode=text
        kind: original_abstract
      - quote: "This tendency, called the isolation effect, leads to inconsistent preferences when the same choice is presented in different forms."
        url: https://ideas.repec.org/a/ecm/emetrp/v47y1979i2p263-91.html
        kind: original_abstract
    replication:
      note: >-
        The gain-versus-loss framing problem was one of 13 effects in Many Labs 1 (Klein et
        al. 2014, Social Psychology 45(3), doi 10.1027/1864-9335/a000178). Ten effects
        replicated; the abstract names imagined contact as weak and flag priming and currency
        priming as failures.
      url: https://api.crossref.org/works/10.1027/1864-9335/a000178
    status: verified

  - id: planning-fallacy
    topic: judgment and heuristics
    finding: >-
      The planning fallacy, underestimating how long one's own task will take, was named by
      Kahneman and Tversky in "Intuitive prediction: Biases and corrective procedures"
      (technical report 1977, usually cited as 1979); Buehler, Griffin and Ross (1994) is
      the main experimental follow-up.
    terms:
      - planning fallacy
      - underestimate task completion times
      - optimistic completion estimates
      - optimism in time estimates
      - intuitive prediction
    original:
      authors: ["Kahneman, Daniel", "Tversky, Amos"]
      year: 1977
      title: "Intuitive prediction: Biases and corrective procedures"
      container: Decision Research Technical Report PTR-1042-77-6
      volume: null
      issue: null
      pages: null
      doi: null
      note: >-
        Reprinted in Kahneman, Slovic and Tversky (eds.), Judgment under Uncertainty:
        Heuristics and Biases (Cambridge University Press, 1982), pp. 414-421,
        doi 10.1017/CBO9780511809477.031, which matches Crossref.
    often_miscited_as:
      - source: Buehler, Griffin and Ross (1994), Journal of Personality and Social Psychology 67(3)
        doi: 10.1037/0022-3514.67.3.366
        why: The main experimental study; its title puts "planning fallacy" in quotation marks, an existing term.
        code: S4
      - source: Lovallo and Kahneman (2003), Harvard Business Review
        why: Source for an expanded definition covering costs, risks and benefits, not for the original term.
        code: S4
      - source: Kahneman (2011), Thinking, Fast and Slow
        why: Popular book; secondhand.
        code: S5
    rule: >-
      Credit the term to Kahneman and Tversky (1977 report, 1979 publication or the 1982
      reprint; all three dates occur). A sentence saying Buehler, Griffin and Ross (1994)
      coined or discovered the planning fallacy is misattributed (S4), though citing them for
      the experimental evidence is correct.
    evidence:
      - quote: "The planning fallacy was first proposed by Daniel Kahneman and Amos Tversky in 1979."
        url: https://en.wikipedia.org/wiki/Planning_fallacy
        kind: encyclopedia
      - quote: "In 2003, Lovallo and Kahneman proposed an expanded definition as the tendency to underestimate the time, costs, and risks of future actions and at the same time overestimate the benefits of the same actions."
        url: https://en.wikipedia.org/wiki/Planning_fallacy
        kind: encyclopedia
      - quote: "Exploring the ... planning fallacy ... Why people underestimate their task completion times."
        url: https://api.crossref.org/works/10.1037/0022-3514.67.3.366
        kind: metadata_record
    status: likely
    notes: >-
      Likely, not verified: the original has no DOI and is not in Crossref. The 1977
      technical report is listed by Wikipedia and on DTIC (ADA047747), but the DTIC PDF
      refused automated access, so the term was not confirmed in the report's text. The 1979
      journal version (often cited as TIMS Studies in Management Science 12) could not be
      verified, so its volume and pages are left out.

  - id: better-than-average-drivers
    topic: judgment and heuristics
    finding: >-
      Svenson (1981) asked student samples in the United States and Sweden to compare their
      driving skill and safety with the others in the group; most placed themselves above
      the median, more so in the US sample.
    terms:
      - better-than-average effect
      - above-average effect
      - illusory superiority
      - 93% of drivers
      - drivers think they are above average
      - overconfidence in driving
      - self-enhancement
    original:
      authors: ["Svenson, Ola"]
      year: 1981
      title: Are we all less risky and more skillful than our fellow drivers?
      container: Acta Psychologica
      volume: "47"
      issue: "2"
      pages: "143-148"
      doi: 10.1016/0001-6918(81)90005-6
    often_miscited_as:
      - source: Svenson (1981) cited for "93% of drivers" in general
        why: >-
          93% is the US student sample's share for skill; the Swedish share was 69%, and the
          samples were 161 students in total. Generalizing to all drivers overreaches.
        code: S3
      - source: Kruger and Dunning (1999), Journal of Personality and Social Psychology 77(6)
        doi: 10.1037/0022-3514.77.6.1121
        why: A different finding (low performers overestimating their test scores), not the driver survey.
        code: S4
    rule: >-
      Cite Svenson (1981) for the driver self-assessment result and check the number. A
      sentence saying that 93% of drivers rate themselves above average overreaches (S3):
      that share comes from a small US student sample.
    evidence:
      - quote: "Svenson (1981) surveyed 161 students in Sweden and the United States, asking them to compare their driving skills and safety to other people's. For driving skills, 93% of the U.S. sample and 69% of the Swedish sample put themselves in the top 50%"
        url: https://en.wikipedia.org/wiki/Illusory_superiority
        kind: encyclopedia
    status: verified
    notes: >-
      The percentages and sample size come from the encyclopedia; the original's text was
      not reachable (the publisher blocks automated access), so check exact figures against
      the article before quoting them.

  - id: dunning-kruger
    topic: judgment and heuristics
    finding: >-
      Kruger and Dunning (1999) found that participants scoring in the bottom quartile on
      tests of humor, grammar and logic greatly overestimated their performance; the effect
      is called "Dunning-Kruger" although Kruger is the first author.
    terms:
      - Dunning-Kruger effect
      - Dunning–Kruger
      - unskilled and unaware
      - incompetent overestimate their ability
      - metacognitive deficit
      - bottom quartile overestimation
    original:
      authors: ["Kruger, Justin", "Dunning, David"]
      year: 1999
      title: "Unskilled and unaware of it: How difficulties in recognizing one's own incompetence lead to inflated self-assessments."
      container: Journal of Personality and Social Psychology
      volume: "77"
      issue: "6"
      pages: "1121-1134"
      doi: 10.1037/0022-3514.77.6.1121
    often_miscited_as:
      - source: "\"Dunning and Kruger (1999)\""
        why: Author order reversed, copied from the effect's name.
        code: CIT-03
      - source: Kruger and Dunning (1999) cited for "people with low intelligence are overconfident"
        why: The finding is about overestimation of one's own performance in specific domains, not general intelligence.
        code: S2
    rule: >-
      The reference is Kruger and Dunning (1999); "Dunning and Kruger (1999)" reverses the
      author order (CIT-03). A sentence describing the result as low-intelligence people
      being overconfident misdescribes it (S2).
    evidence:
      - quote: "Across 4 studies, the authors found that participants scoring in the bottom quartile on tests of humor, grammar, and logic grossly overestimated their test performance and ability."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=10626367&rettype=abstract&retmode=text
        kind: original_abstract
      - quote: "Kruger J(1), Dunning D."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=10626367&rettype=abstract&retmode=text
        kind: metadata_record
      - quote: "In popular culture, the Dunning–Kruger effect is sometimes misunderstood as claiming that people with low intelligence are generally overconfident, instead of denoting specific overconfidence of people unskilled in particular areas"
        url: https://en.wikipedia.org/wiki/Dunning%E2%80%93Kruger_effect
        kind: encyclopedia
    replication:
      note: >-
        A statistical explanation holds that much of the pattern may be a statistical effect
