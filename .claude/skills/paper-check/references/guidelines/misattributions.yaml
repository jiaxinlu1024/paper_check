      url: https://en.wikipedia.org/wiki/Dunning%E2%80%93Kruger_effect
    status: verified

  - id: hot-hand
    topic: judgment and heuristics
    finding: >-
      Gilovich, Vallone and Tversky (1985) concluded that basketball shooting shows no hot
      hand and that belief in it misperceives random sequences; Miller and Sanjurjo (2018)
      showed a streak-selection bias in that test which, once corrected, reverses the
      conclusion.
    terms:
      - hot hand
      - hot-hand fallacy
      - hot hand in basketball
      - streak shooting
      - misperception of random sequences
      - streak selection bias
    original:
      authors: ["Gilovich, Thomas", "Vallone, Robert", "Tversky, Amos"]
      year: 1985
      title: "The hot hand in basketball: On the misperception of random sequences"
      container: Cognitive Psychology
      volume: "17"
      issue: "3"
      pages: "295-314"
      doi: 10.1016/0010-0285(85)90010-6
    often_miscited_as:
      - source: "\"Gilovich, Tversky and Vallone (1985)\""
        why: Author order; Crossref lists Gilovich, Vallone, Tversky (the encyclopedia text uses the other order).
        code: CIT-03
      - source: Gilovich, Vallone and Tversky (1985) cited as settled proof that the hot hand is a fallacy
        why: Miller and Sanjurjo (2018) show that the original test is biased and that correcting it reverses the conclusion.
        code: CIT-14
    rule: >-
      Cite Gilovich, Vallone and Tversky (1985), in that order, for the original claim. A
      sentence presenting the hot-hand fallacy as established should acknowledge Miller and
      Sanjurjo (2018), Econometrica 86(6), doi 10.3982/ECTA14943 (CIT-14).
    evidence:
      - quote: "The fallacy was first described in a 1985 paper by Thomas Gilovich, Amos Tversky, and Robert Vallone."
        url: https://en.wikipedia.org/wiki/Hot_hand
        kind: encyclopedia
      - quote: "We observe that the canonical study in the influential hot hand fallacy literature, along with replications, are vulnerable to the bias. Upon correcting for the bias, we find that the longstanding conclusions of the canonical study are reversed."
        url: https://www.econometricsociety.org/publications/econometrica/2018/11/01/surprised-hot-hand-fallacy-truth-law-small-numbers
        kind: later_paper
    replication:
      note: Miller and Sanjurjo (2018) find significant evidence of streak shooting after correcting the streak-selection bias.
      url: https://www.econometricsociety.org/publications/econometrica/2018/11/01/surprised-hot-hand-fallacy-truth-law-small-numbers
    status: verified

  # ------------------------------------------------------- bounded rationality and cognition

  - id: bounded-rationality
    topic: bounded rationality and cognition
    finding: >-
      Simon (1955) proposed a behavioral model of rational choice for agents with limited
      information and computing capacity; the term "bounded rationality" first appears in his
      book Models of Man (1957), and "satisficing" in Simon (1956).
    terms:
      - bounded rationality
      - boundedly rational
      - satisficing
      - satisfice
      - limited rationality
      - procedural rationality
      - aspiration level
    original:
      authors: ["Simon, Herbert A."]
      year: 1955
      title: A Behavioral Model of Rational Choice
      container: The Quarterly Journal of Economics
      volume: "69"
      issue: "1"
      pages: "99-118"
      doi: 10.2307/1884852
    often_miscited_as:
      - source: Simon (1955) cited as coining the term "bounded rationality"
        why: The Stanford Encyclopedia of Philosophy dates the term to Simon (1957), Models of Man, p. 198.
        code: S4
      - source: Kahneman (2003), "Maps of bounded rationality", American Economic Review 93(5)
        doi: 10.1257/000282803322655392
        why: Uses the term in its title; secondhand for the concept's origin.
        code: S5
    rule: >-
      Simon (1955) is the right source for the behavioral model of rational choice and Simon
      (1956), Psychological Review 63(2), doi 10.1037/h0042769, for "satisficing". A sentence
      saying Simon coined "bounded rationality" in 1955 points to the wrong work (S4, minor):
      the term dates from Models of Man (1957). Citing Kahneman (2003) or later reviews as
      the origin is secondhand (S5).
    evidence:
      - quote: "Herbert Simon introduced the term ‘bounded rationality’ (Simon 1957b: 198; see also Klaes & Sent 2005) as shorthand for his proposal to replace the perfect rationality assumptions of homo economicus with a concept of rationality better suited to cognitively limited agents"
        url: https://plato.stanford.edu/entries/bounded-rationality/
        kind: encyclopedia
      - quote: "Herbert Simon (1978 Laureate in Economic Sciences) explored the effects of limited cognition and analyzed the implications of individual bounded rationality on the design and performance of organizations (Simon 1955)."
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "was introduced by Herbert A. Simon in 1956"
        url: https://en.wikipedia.org/wiki/Satisficing
        kind: encyclopedia
    status: verified
    notes: >-
      Crossref lists only the first page (99); the range is from RePEc/IDEAS. Models of Man
      (Wiley, 1957) reprints the 1955 paper and has no DOI. The 2002 Nobel background cites
      Simon (1956) for bounded rationality, so both 1955 and 1956 citations are common and
      acceptable for the concept.

