      income targeting reverses his conclusion (S2).
    evidence:
      - quote: "Estimated wage elasticities are significantly negative in two out of three samples."
        url: https://ideas.repec.org/a/oup/qjecon/v112y1997i2p407-441..html
        kind: original_abstract
      - quote: "set a loose daily income target and quit working once they reach that target."
        url: https://ideas.repec.org/a/oup/qjecon/v112y1997i2p407-441..html
        kind: original_abstract
      - quote: "This pattern is inconsistent with an important role for reference-dependent preferences."
        url: https://www.aeaweb.org/articles?id=10.1257/aer.98.3.1069
        kind: later_paper
    replication:
      note: >-
        Crawford and Meng (2011, American Economic Review 101(5), doi 10.1257/aer.101.5.1912)
        reconcile Farber's stopping results with Camerer et al.'s negative elasticity using
        rational-expectations targets for hours and income.
      url: https://www.aeaweb.org/articles?id=10.1257/aer.101.5.1912
    status: verified
    notes: >-
      Farber (2005) is doi 10.1086/426040; its abstract was not available, so the evidence
      quote is from Farber (2008).

  # ------------------------------------------------------------- contested psychology findings

  - id: ego-depletion
    topic: contested psychology findings
    finding: >-
      Baumeister, Bratslavsky, Muraven and Tice (1998) proposed that self-control draws on a
      limited resource ("ego depletion"), using experiments such as eating radishes instead of
      chocolates; a 23-lab preregistered replication found an effect near zero.
    terms:
      - ego depletion
      - self-control as a limited resource
      - willpower depletion
      - strength model of self-control
      - resource depletion
      - radishes and chocolates
    original:
      authors: ["Baumeister, Roy F.", "Bratslavsky, Ellen", "Muraven, Mark", "Tice, Dianne M."]
      year: 1998
      title: "Ego depletion: Is the active self a limited resource?"
      container: Journal of Personality and Social Psychology
      volume: "74"
      issue: "5"
      pages: "1252-1265"
      doi: 10.1037/0022-3514.74.5.1252
    often_miscited_as:
      - source: Muraven, Tice and Baumeister (1998), Journal of Personality and Social Psychology 74(3)
        doi: 10.1037/0022-3514.74.3.774
        why: The companion paper on regulatory depletion; check which of the two contains the experiment cited.
        code: S4
      - source: Baumeister et al. (1998) cited as an established effect
        why: The multilab replication found d = 0.04 with a confidence interval including zero.
        code: CIT-14
    rule: >-
      Cite Baumeister et al. (1998) for the ego-depletion hypothesis and the radish and
      chocolate experiment. A sentence that treats ego depletion as established should note
      the multilab replication of Hagger et al. (2016) (CIT-14).
    evidence:
      - quote: "In Experiment 1, people who forced themselves to eat radishes instead of tempting chocolates subsequently quit faster on unsolvable puzzles than people who had not had to exert self-control over eating."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=9599441&rettype=abstract&retmode=text
        kind: original_abstract
    replication:
      note: >-
        Hagger et al. (2016, Perspectives on Psychological Science 11(4), doi
        10.1177/1745691616652873), 23 laboratories, N = 2,141: ego-depletion effect d = 0.04,
        95% CI [-0.07, 0.15].
      url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=27474142&rettype=abstract&retmode=text
    status: verified

  - id: money-priming
    topic: contested psychology findings
    finding: >-
      Vohs, Mead and Goode (2006) reported nine experiments in which reminders of money made
      people more self-sufficient and less helpful; later direct replications of related
      money-priming effects failed, and a meta-analysis found likely publication bias.
    terms:
      - money priming
      - money prime
      - reminders of money
      - psychological consequences of money
      - currency priming
      - self-sufficiency and money
    original:
      authors: ["Vohs, Kathleen D.", "Mead, Nicole L.", "Goode, Miranda R."]
      year: 2006
      title: The Psychological Consequences of Money
      container: Science
      volume: "314"
      issue: "5802"
      pages: "1154-1156"
      doi: 10.1126/science.1132491
    often_miscited_as:
      - source: Caruso, Vohs, Baxter and Waytz (2013), Journal of Experimental Psychology General 142(2)
        doi: 10.1037/a0029288
        why: >-
          A different money-priming claim (endorsement of free markets and inequality), the
          one that failed in Many Labs 1 and in Rohrer, Pashler and Harris (2015); do not
          conflate it with the 2006 helping results.
        code: S4
      - source: Vohs et al. (2006) cited as an established effect
        why: Replications of money-priming effects largely failed and the published literature shows likely publication bias.
        code: CIT-14
    rule: >-
      Cite Vohs, Mead and Goode (2006) for the original money-priming claims, and flag any
      sentence that presents money priming as established (CIT-14): currency priming did not
      replicate in Many Labs 1, Rohrer, Pashler and Harris (2015) found no evidence for four
      Caruso et al. (2013) effects (d = 0.03), and Lodder et al. (2019) found likely
      publication bias across 246 experiments.
    evidence:
      - quote: "Reminders of money, relative to nonmoney reminders, led to reduced requests for help and reduced helpfulness toward others."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=17110581&rettype=abstract&retmode=text
        kind: original_abstract
      - quote: "We conducted high-powered replication attempts of these 4 money priming effects and found no evidence of priming (weighted Cohen's d = 0.03)."
        url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=26214168&rettype=abstract&retmode=text
        kind: later_paper
      - quote: "two effects ... flag priming influencing conservatism and currency priming influencing system justification ... did not replicate."
        url: https://api.crossref.org/works/10.1027/1864-9335/a000178
        kind: later_paper
    replication:
      note: >-
        Lodder, Ong, Grasman and Wicherts (2019, Journal of Experimental Psychology General
        148(4), doi 10.1037/xge0000570): overall g = .31 across 246 experiments, but
        "publication bias and related biases are likely".
      url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=30973262&rettype=abstract&retmode=text
    status: verified
    notes: >-
      PubMed lists a 2015 erratum for Vohs, Mead and Goode (2006): Science 349(6246):
      aac9679, doi 10.1126/science.aac9679.
