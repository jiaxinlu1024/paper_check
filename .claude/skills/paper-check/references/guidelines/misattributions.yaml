  - id: dictator-game
    topic: social preferences and games
    finding: >-
      The dictator game originates in an allocation experiment in Kahneman, Knetsch and
      Thaler (1986), where students chose between an equal and an unequal split of $20 with
      an anonymous classmate; Forsythe, Horowitz, Savin and Sefton (1994) introduced the
      now-standard free-allocation version.
    terms:
      - dictator game
      - dictator
      - allocation game
      - giving in the dictator game
      - anonymous allocation experiment
    original:
      authors: ["Kahneman, Daniel", "Knetsch, Jack L.", "Thaler, Richard H."]
      year: 1986
      title: Fairness and the Assumptions of Economics
      container: The Journal of Business
      volume: "59"
      issue: "S4"
      pages: "S285-S300"
      doi: 10.1086/296367
    often_miscited_as:
      - source: Forsythe, Horowitz, Savin and Sefton (1994), Games and Economic Behavior 6(3)
        doi: 10.1006/game.1994.1021
        why: Right for the standard unrestricted dictator game; calling it the first dictator experiment is a mild misattribution.
        code: S4
      - source: Kahneman, Knetsch and Thaler (1986), "Fairness as a constraint on profit seeking", American Economic Review 76(4)
        why: The other 1986 fairness paper, on fairness judgments in markets; not the dictator experiment.
        code: S4
    rule: >-
      For the first dictator-type experiment, cite Kahneman, Knetsch and Thaler (1986),
      "Fairness and the Assumptions of Economics", Journal of Business, not their 1986
      American Economic Review paper. Forsythe et al. (1994) is the right source for the
      standard dictator game; calling it the first dictator experiment is a mild
      misattribution (S4).
    evidence:
      - quote: "Kahneman, Knetsch and Thaler (1986a) introduced an experiment, subsequently known as the dictator game. Students in an undergraduate psychology class at Cornell University were asked to divide an endowment of $20"
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "1986a. Fairness and the Assumptions of Economics. Journal of Business 59, S285-S300."
        url: https://www.nobelprize.org/uploads/2018/06/advanced-economicsciences2017.pdf
        kind: review
      - quote: "However, it was only in 1994 that a paper by Forsythe et al. simplified this to the contemporary form of this game with one decision-maker (the dictator) and one passive participant (the recipient)."
        url: https://en.wikipedia.org/wiki/Dictator_game
        kind: encyclopedia
    status: verified
    notes: >-
      Crossref gives issue "S4" and only the first page (S285); RePEc gives issue 4, pages
