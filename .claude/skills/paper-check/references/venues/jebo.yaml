id: jebo
name: Journal of Economic Behavior & Organization
abbreviation: JEBO
publisher: Elsevier
group: field
checked_on: "2026-10-17"
notes: >-
  The journal's guide for authors exists only on ScienceDirect, which returned HTTP 403 to automated
  requests; Elsevier's own journal page, the old elsevier.com guide URLs and the Editorial Manager site
  all point back to it. Journal-specific rules below are therefore unconfirmed, most with values taken
  from web search summaries of the guide. Confirmed rules come from Elsevier-wide policy pages that
  apply to all Elsevier journals, as each note says. Verify the unconfirmed rules in a browser.
sources:
  - id: guide
    url: https://www.sciencedirect.com/journal/journal-of-economic-behavior-and-organization/publish/guide-for-authors
    title: Guide for authors, Journal of Economic Behavior & Organization (ScienceDirect)
    access: blocked
    note: HTTP 403 ("There was a problem providing the content you requested"). Page blocked automated access; verify in a browser.
  - id: guide_search
    url: https://www.sciencedirect.com/journal/journal-of-economic-behavior-and-organization/publish/guide-for-authors
    title: Guide for authors, Journal of Economic Behavior & Organization (web search summary)
    access: search_summary
    note: Summary text returned by the web search tool for this URL on 2026-10-17 (four searches); not the page's own wording.
  - id: shop_search
    url: https://shop.elsevier.com/journals/journal-of-economic-behavior-and-organization/0167-2681
    title: Journal of Economic Behavior & Organization, Elsevier journal page (web search summary)
    access: search_summary
    note: >-
      A web search summary attributed a submission fee to "an Elsevier shop listing". The page itself
      (source shop) was read on 2026-10-17 and contains no fee text.
  - id: shop
    url: https://shop.elsevier.com/journals/journal-of-economic-behavior-and-organization/0167-2681
    title: Journal of Economic Behavior & Organization, Elsevier journal page
    access: read
    note: Aims and scope only; points to ScienceDirect for the guide for authors.
  - id: em
    url: https://www.editorialmanager.com/jebo/default.aspx
    title: Editorial Manager, Journal of Economic Behavior and Organization
    access: read
    note: Login page; its "Instructions For Authors" link redirects to the blocked ScienceDirect guide. No instructions of its own.
  - id: el_genai
    url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
    title: Generative AI policies for journals (Elsevier-wide)
    access: read
  - id: el_ethics
    url: https://www.elsevier.com/about/policies-and-standards/publishing-ethics
    title: Publishing ethics (Elsevier-wide)
    access: read
  - id: el_research_ethics
    url: https://www.elsevier.com/about/policies-and-standards/research-ethics
    title: Research ethics (Elsevier-wide)
    access: read
  - id: el_highlights
    url: https://www.elsevier.com/researcher/author/tools-and-resources/highlights
    title: Highlights (Elsevier-wide)
    access: read
  - id: el_graphical_abstract
    url: https://www.elsevier.com/researcher/author/tools-and-resources/graphical-abstract
    title: Graphical abstract (Elsevier-wide)
    access: read
  - id: el_research_data_faq
    url: https://www.elsevier.com/about/policies-and-standards/research-data/faq
    title: Research data FAQs (Elsevier-wide)
    access: read
  - id: el_data_statement
    url: https://www.elsevier.com/researcher/author/tools-and-resources/research-data/data-statement
    title: Data statement (Elsevier-wide)
    access: read
  - id: el_submission_fees
    url: https://www.elsevier.com/researcher/author/policies-and-guidelines/submission-fees
    title: Submission fees (Elsevier economics, finance and accounting journals)
    access: read
  - id: el_latex
    url: https://www.elsevier.com/researcher/author/policies-and-guidelines/latex-instructions
    title: LaTeX instructions (Elsevier-wide)
    access: read
