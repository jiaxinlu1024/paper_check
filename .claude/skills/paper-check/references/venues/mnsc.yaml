id: mnsc
name: Management Science
abbreviation: MS
publisher: INFORMS
group: field
checked_on: "2026-10-17"
notes: >-
  Behavioral economics papers usually go to the Behavioral Economics and Decision
  Analysis (BEDA) department. Every INFORMS PubsOnline page (guidelines, policies,
  department statement) and the ScholarOne site refused automated access, and the main
  INFORMS site only links to PubsOnline. Confirmed rules come from Editor-in-Chief
  messages on INFORMS's own community site; unconfirmed values come from web-search
  summaries of the blocked pages and need checking in a browser.
