id: aej_applied
name: "American Economic Journal: Applied Economics"
abbreviation: "AEJ: Applied"
publisher: American Economic Association
group: general
checked_on: "2026-10-17"
notes: >-
  Rules are shared across the AEA journals unless a rule says otherwise. Since fall 2026 every submission
  must be anonymized because the AEA is running a three-year randomized trial of author-anonymized review;
  the journal's Editorial Policy page still describes single-blind review. Papers reviewed at the AER or
  AER Insights can be transferred with their referee reports. The Style Guide binds accepted articles only.
sources:
  - id: submissions
    url: https://www.aeaweb.org/journals/app/submissions
    title: "AEJ: Applied Economics Submission Guidelines"
    access: read
  - id: editorial_policy
    url: https://www.aeaweb.org/journals/app/editorial-policy
    title: "AEJ: Applied Economics Editorial Policy"
    access: read
  - id: style_guide
    url: https://www.aeaweb.org/journals/app/style-guide
