    url: https://editorialexpress.com/qje
    title: QJE submission form (Editorial Express)
    access: read
    note: >-
      Redirects to e-submit.cgi?dbase=qje. Its step menu lists six steps (identify submitter, title and
      abstract, coauthors, manuscript and cover letter, other files, review and submit) and no fee payment step.
