id: qje
name: The Quarterly Journal of Economics
abbreviation: QJE
publisher: Oxford University Press for the Department of Economics, Harvard University
group: general-top5
checked_on: "2026-10-17"
notes: >-
  Nearly every official page refused automated access on 2026-10-17: Oxford Academic (Cloudflare challenge),
  Harvard's economics site (Akamai "Access Denied") and the QJE Dataverse (AWS WAF challenge). Only the
  Editorial Express submission page could be read, so only the file format and two submission-system rules are
  confirmed. The other rules quote web-search summaries, which paraphrase the pages; verify each one in a
  browser before relying on it.
sources:
