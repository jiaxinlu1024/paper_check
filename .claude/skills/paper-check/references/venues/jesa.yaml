id: jesa
name: Journal of the Economic Science Association
abbreviation: JESA
publisher: Cambridge University Press
group: field
checked_on: "2026-10-17"
notes: >-
  Short-paper companion journal to Experimental Economics, owned by the Economic Science
  Association (ESA). Published by Cambridge University Press and fully open access from 2025.
  ESA policies (replication policy, ethical guidelines) apply on top of the Cambridge author
  instructions. Unlike Experimental Economics, JESA's own pages do not ban deception or require
  incentives.
