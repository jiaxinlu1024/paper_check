id: restud
name: The Review of Economic Studies
abbreviation: REStud
publisher: Oxford University Press for The Review of Economic Studies Ltd
group: general-top5
checked_on: "2026-10-17"
notes: >-
  The journal's own site (restud.com) and its Data Editor's site (restud.dataeditor.group, built from
  github.com/restud/data-editor) could be read in full. Oxford Academic's Instructions to Authors page for the
  journal refused automated access, so rules that only it would settle (JEL codes, reference style, AI use)
  are unconfirmed. restud.com introduces its title-page, abstract, acknowledgement and table guidance with
  "The following guidance is suggested only", so treat breaches of those items as warnings. The 45-page
  limit, the single-PDF rule and the fee are stated as requirements.
sources:
  - id: submissions
    url: https://www.restud.com/submissions/
    title: REStud Submission Guidelines and Policy
    access: read
  - id: editorial_express
    url: https://editorialexpress.com/restud
    title: REStud submission form (Editorial Express)
    access: read
    note: >-
      Redirects to e-submit.cgi?dbase=restud. The step menu includes "Pay Submission fee", and all authors
      must confirm the Submission Policy before the process continues.
  - id: dcap
    url: https://raw.githubusercontent.com/restud/data-editor/master/policy.md
    title: REStud Data and Code Availability Policy (source file in github.com/restud/data-editor)
    access: read
    note: >-
      Markdown source of https://restud.dataeditor.group/policy/, the page restud.com links to. The rendered
      page adds the DCAS v1.0 rule table.
  - id: dcap_page
    url: https://restud.dataeditor.group/policy/
    title: REStud Data and Code Availability Policy (Data Editor site)
    access: read
  - id: after_acceptance
    url: https://raw.githubusercontent.com/restud/data-editor/master/after-acceptance.md
    title: REStud Data Editor, After Your Paper is Accepted (source file)
    access: read
    note: Rendered at https://restud.dataeditor.group/after-acceptance/.
  - id: citation_guide
    url: https://restud.dataeditor.group/citation-guide/
    title: REStud Data Editor, Data citation guide
    access: read
  - id: oup_instructions
    url: https://academic.oup.com/restud/pages/general_instructions
    title: REStud Instructions to Authors (Oxford Academic)
    access: blocked
    note: Answered HTTP 403 with a Cloudflare "Just a moment..." challenge on 2026-10-17. Not bypassed.
  - id: oup_instructions_search
    url: https://academic.oup.com/restud/pages/general_instructions
    title: REStud Instructions to Authors (Oxford Academic), web-search summary
    access: search_summary
    note: >-
      Summary returned by the session's web search on 2026-10-17. It paraphrases the page and is not a
