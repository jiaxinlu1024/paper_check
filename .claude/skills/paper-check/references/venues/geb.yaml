id: geb
name: Games and Economic Behavior
abbreviation: GEB
publisher: Elsevier
group: field
checked_on: "2026-10-17"
notes: >-
  Editorial transition. Per the Game Theory Society (GTS), Elsevier did not renew editor Hervé Moulin's
  contract and all seven editors resigned; they process new submissions until 14 November 2026 and may
  return them if the depleted board cannot handle them. The GTS ends its association with GEB effective
  15 November 2026 and is exploring a new society-owned journal. Policies may change under new editors:
  recheck this profile after November 2026. The guide for authors exists only on ScienceDirect, which
  returned HTTP 403, so journal-specific rules are unconfirmed, most with values from web search
  summaries of the guide. Confirmed rules come from Elsevier-wide policy pages, the Elsevier journal
  page and the GTS site, as each note says.
