id: jeea
name: Journal of the European Economic Association
abbreviation: JEEA
publisher: Oxford University Press for the European Economic Association
group: general
checked_on: "2026-10-17"
notes: >-
  The Author Guidelines on Oxford Academic, which hold most format and policy rules,
  refused automated access, and so did the EEA's own "Guidelines for Authors" download
  and its JEEA home page. Confirmed rules come from the EEA's submission, fee and
  Data Editor pages and from the Editorial Express submission form. Unconfirmed values
  come from web-search summaries of the blocked guidelines; check them in a browser.
sources:
  - id: oup_guidelines
    url: https://academic.oup.com/jeea/pages/Author_Guidelines
    title: Instructions to Authors (Author Guidelines), Oxford Academic
    access: blocked
    note: HTTP 403 with a Cloudflare challenge on 2026-10-17.
  - id: oup_guidelines_search
    url: https://academic.oup.com/jeea/pages/Author_Guidelines
    title: Instructions to Authors, as shown in web-search summaries
    access: search_summary
    note: Text seen only in web-search result summaries on 2026-10-17. Summaries can paraphrase or leave text out.
  - id: oup_why_publish
    url: https://academic.oup.com/jeea/pages/why-publish
    title: Publishing with the Journal of the European Economic Association, Oxford Academic
    access: blocked
    note: HTTP 403 with a Cloudflare challenge on 2026-10-17.
  - id: oup_why_publish_search
    url: https://academic.oup.com/jeea/pages/why-publish
    title: Publishing with the Journal of the European Economic Association, as shown in web-search summaries
    access: search_summary
