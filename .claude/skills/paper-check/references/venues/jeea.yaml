    url: https://eeassoc-org.s3.eu-west-3.amazonaws.com/s3fs-public/2020-11/Instruction-to-Authors.zip?VersionId=mAWwzOSPi71lsjHt74jNbFWIg09NSbPy
    title: Guidelines for Authors (ZIP download linked from the EEA's Submit your paper page)
    access: blocked
